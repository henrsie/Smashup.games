name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Run backend tests
        run: npm test --prefix backend

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install modal==1.2.6 numpy==2.0.2
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0+cpu

      - name: Run Python tests
        env:
          PYTHONPATH: python
        run: python -m unittest discover -s python -p "test_*.py"

  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs:
      - backend-tests
      - frontend-build
      - python-tests
    runs-on: ubuntu-latest

    steps:
      - name: Confirm every build and test job passed
        env:
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-build.result }}
          PYTHON_RESULT: ${{ needs.python-tests.result }}
        run: |
          test "$BACKEND_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$PYTHON_RESULT" = "success"
